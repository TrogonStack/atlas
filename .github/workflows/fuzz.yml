name: Fuzz

on:
  schedule:
    - cron: "30 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  runs-on:
    uses: ./.github/workflows/runs-on.yml

  fuzz:
    name: Fuzz
    needs: runs-on
    runs-on: ${{ needs.runs-on.outputs.runs-on }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            rsworkspace/crates/trogon-atlas-store/fuzz
            rsworkspace/crates/trogon-atlas-server/fuzz

      - name: run fuzz targets briefly
        env:
          TROGON_ATLAS_FUZZ_SECONDS: "20"
        run: mise run rust:fuzz

      - name: upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: rsworkspace/crates/*/fuzz/artifacts/
          retention-days: 7
