name: Infra

on:
  push:
    branches:
      - main
    paths:
      - devops/**
      - "**/Dockerfile*"
      - .config/hadolint.yaml
      - .config/ct.yaml
      - .config/mise/tasks/github/workflows/infra/**
      - .config/mise/tasks/github/actions/docker-buildx/**
      - .config/mise/tasks/images/**
      - .github/workflows/infra.yml
      - mise.toml
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
    paths:
      - devops/**
      - "**/Dockerfile*"
      - .config/hadolint.yaml
      - .config/ct.yaml
      - .config/mise/tasks/github/workflows/infra/**
      - .config/mise/tasks/github/actions/docker-buildx/**
      - .config/mise/tasks/images/**
      - .github/workflows/infra.yml
      - mise.toml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  runs-on:
    uses: ./.github/workflows/runs-on.yml

  hadolint:
    name: Hadolint
    needs: runs-on
    runs-on: ${{ needs.runs-on.outputs.runs-on }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      - name: hadolint
        run: mise run github:workflows:infra:hadolint

  helm:
    name: Helm
    needs: runs-on
    runs-on: ${{ needs.runs-on.outputs.runs-on }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      - name: helm lint
        run: mise run github:workflows:infra:helm-lint

      - name: kubeconform
        run: mise run github:workflows:infra:kubeconform

  charts:
    name: Charts
    needs: runs-on
    runs-on: ${{ needs.runs-on.outputs.runs-on }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      - name: ct lint
        run: mise run github:workflows:infra:ct-lint

  docker:
    name: Docker
    needs: runs-on
    runs-on: ${{ needs.runs-on.outputs.runs-on }}
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      - name: Reclaim runner disk
        run: mise run github:workflows:ci:reclaim-disk

      - name: Set up buildx
        run: mise run github:actions:docker-buildx:setup

      - name: Expose the Actions cache to buildx
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            for (const [key, value] of Object.entries(process.env)) {
              if (key.startsWith('ACTIONS_')) core.exportVariable(key, value);
            }

      - name: build images
        run: mise run github:workflows:infra:docker-build

      - name: trivy image
        run: mise run github:workflows:infra:trivy-image

      - name: upload trivy SARIF
        if: ${{ !cancelled() && hashFiles('trivy-results/*.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-results

  trivy:
    name: Trivy
    needs: runs-on
    runs-on: ${{ needs.runs-on.outputs.runs-on }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      - name: trivy config
        run: mise run github:workflows:infra:trivy-config
