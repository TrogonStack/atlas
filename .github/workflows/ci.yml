name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  runs-on:
    uses: ./.github/workflows/runs-on.yml

  rust:
    name: Rust
    needs: runs-on
    runs-on: ${{ needs.runs-on.outputs.runs-on }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Reclaim runner disk
        run: mise run github:workflows:ci:reclaim-disk

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rsworkspace

      - name: cargo fmt --check
        run: mise run github:workflows:ci:rust-fmt

      - name: cargo clippy
        run: mise run github:workflows:ci:rust-clippy

      - name: cargo machete
        run: mise run github:workflows:ci:rust-machete

      - name: cargo doc
        run: mise run github:workflows:ci:rust-doc

      - name: cargo test
        env:
          TROGON_ATLAS_TEST_NATS_URL: ""
        run: mise run github:workflows:ci:rust-test

  rust-coverage:
    name: Coverage
    needs: runs-on
    runs-on: ${{ needs.runs-on.outputs.runs-on }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Reclaim runner disk
        run: mise run github:workflows:ci:reclaim-disk

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rsworkspace

      - name: cargo llvm-cov
        env:
          TROGON_ATLAS_TEST_NATS_URL: ""
        run: mise run github:workflows:ci:rust-coverage

      - name: upload coverage to codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: rsworkspace/lcov.info
          flags: rust
          use_oidc: true
          fail_ci_if_error: false

  deny:
    name: Dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: cargo deny
        run: mise run github:workflows:ci:rust-deny

  proto:
    name: Proto
    needs: runs-on
    runs-on: ${{ needs.runs-on.outputs.runs-on }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: buf lint
        run: mise run github:workflows:ci:proto-lint

      - name: generated code is up to date
        run: mise run github:workflows:ci:proto-generated

      - name: buf breaking against main
        if: github.event_name == 'pull_request'
        env:
          TROGON_ATLAS_PROTO_BASELINE_REF: origin/main
        run: mise run github:workflows:ci:proto-breaking

  studio:
    name: Studio
    needs: runs-on
    runs-on: ${{ needs.runs-on.outputs.runs-on }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: pnpm install
        run: mise run github:workflows:ci:studio-install

      - name: typecheck
        run: mise run github:workflows:ci:studio-typecheck

      - name: lint
        run: mise run github:workflows:ci:studio-lint

      # build before test: the server suite asserts container-mode behaviour
      # that only exists once dist/ is present.
      - name: build
        run: mise run github:workflows:ci:studio-build

      - name: test coverage
        run: mise run github:workflows:ci:studio-coverage

      - name: upload coverage to codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: tsworkspace/webapps/studio/coverage/lcov.info
          flags: studio
          use_oidc: true
          fail_ci_if_error: false

  studio-e2e:
    name: E2E
    needs: runs-on
    runs-on: ${{ needs.runs-on.outputs.runs-on }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: pnpm install
        run: mise run github:workflows:ci:studio-install

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tsworkspace/pnpm-lock.yaml') }}

      - name: install Playwright browsers
        run: mise run github:workflows:ci:studio-e2e-install

      - name: e2e
        run: mise run github:workflows:ci:studio-e2e

      - name: upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: studio-playwright-report
          path: tsworkspace/webapps/studio/playwright-report/
          retention-days: 7
