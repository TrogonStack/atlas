name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  runs-on:
    uses: ./.github/workflows/runs-on.yml

  rust:
    name: Rust - fmt / clippy / test
    needs: runs-on
    runs-on: ${{ needs.runs-on.outputs.runs-on }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4

      - name: Reclaim runner disk
        run: mise run github:workflows:ci:reclaim-disk

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rsworkspace

      - name: cargo fmt --check
        run: mise run github:workflows:ci:rust-fmt

      - name: cargo clippy
        run: mise run github:workflows:ci:rust-clippy

      - name: cargo test
        env:
          TROGON_ATLAS_TEST_NATS_URL: ""
        run: mise run github:workflows:ci:rust-test

  deny:
    name: Rust - dependency policy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4

      - name: cargo deny
        run: mise run github:workflows:ci:rust-deny

  proto:
    name: Proto - lint / breaking
    needs: runs-on
    runs-on: ${{ needs.runs-on.outputs.runs-on }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4

      - name: buf lint
        run: mise run github:workflows:ci:proto-lint

      - name: generated code is up to date
        run: mise run github:workflows:ci:proto-generated

      - name: buf breaking against main
        if: github.event_name == 'pull_request'
        env:
          TROGON_ATLAS_PROTO_BASELINE_REF: origin/main
        run: mise run github:workflows:ci:proto-breaking

  studio:
    name: Studio - typecheck / lint / test / build
    needs: runs-on
    runs-on: ${{ needs.runs-on.outputs.runs-on }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4

      - name: pnpm install
        run: mise run github:workflows:ci:studio-install

      - name: typecheck
        run: mise run github:workflows:ci:studio-typecheck

      - name: lint
        run: mise run github:workflows:ci:studio-lint

      # build before test: the server suite asserts container-mode behaviour
      # that only exists once dist/ is present.
      - name: build
        run: mise run github:workflows:ci:studio-build

      - name: test
        run: mise run github:workflows:ci:studio-test

  studio-e2e:
    name: E2E
    needs: runs-on
    runs-on: ${{ needs.runs-on.outputs.runs-on }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4

      - name: pnpm install
        run: mise run github:workflows:ci:studio-install

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tsworkspace/pnpm-lock.yaml') }}

      - name: install Playwright browsers
        run: mise run github:workflows:ci:studio-e2e-install

      - name: e2e
        run: mise run github:workflows:ci:studio-e2e

      - name: upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: studio-playwright-report
          path: tsworkspace/webapps/studio/playwright-report/
          retention-days: 7
