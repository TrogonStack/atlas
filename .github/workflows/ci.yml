name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  runs-on:
    uses: ./.github/workflows/runs-on.yml

  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      proto: ${{ steps.classify.outputs.proto }}
      studio: ${{ steps.classify.outputs.studio }}
      workflows: ${{ steps.classify.outputs.workflows }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # Runs on the runner's python3 instead of mise: installing the full
      # toolchain here would cost more than most of the jobs it can skip.
      - name: Classify changed paths
        id: classify
        run: python3 .config/mise/lib/ci-changes/changes.py github

  rust:
    name: Rust
    needs: [runs-on, changes]
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ${{ needs.runs-on.outputs.runs-on }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      - name: Reclaim runner disk
        run: mise run github:workflows:ci:reclaim-disk

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rsworkspace

      - name: cargo fmt --check
        run: mise run github:workflows:ci:rust-fmt

      - name: cargo clippy
        run: mise run github:workflows:ci:rust-clippy

      - name: cargo machete
        run: mise run github:workflows:ci:rust-machete

      - name: cargo doc
        run: mise run github:workflows:ci:rust-doc

      - name: cargo test
        env:
          TROGON_ATLAS_TEST_NATS_URL: ""
        run: mise run github:workflows:ci:rust-test

  rust-coverage:
    name: Coverage
    needs: [runs-on, changes]
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ${{ needs.runs-on.outputs.runs-on }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      - name: Reclaim runner disk
        run: mise run github:workflows:ci:reclaim-disk

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rsworkspace

      - name: cargo llvm-cov
        env:
          TROGON_ATLAS_TEST_NATS_URL: ""
        run: mise run github:workflows:ci:rust-coverage

      - name: upload coverage to codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: rsworkspace/lcov.info
          flags: rust
          use_oidc: true
          fail_ci_if_error: false

  deny:
    name: Dependencies
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      - name: cargo deny
        run: mise run github:workflows:ci:rust-deny

  proto:
    name: Proto
    needs: [runs-on, changes]
    if: ${{ !cancelled() && needs.changes.outputs.proto != 'false' }}
    runs-on: ${{ needs.runs-on.outputs.runs-on }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      - name: buf lint
        run: mise run github:workflows:ci:proto-lint

      - name: generated code is up to date
        run: mise run github:workflows:ci:proto-generated

      - name: buf breaking against main
        if: github.event_name == 'pull_request'
        env:
          TROGON_ATLAS_PROTO_BASELINE_REF: origin/main
        run: mise run github:workflows:ci:proto-breaking

  semconv:
    name: Semantic conventions
    needs: runs-on
    runs-on: ${{ needs.runs-on.outputs.runs-on }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      - name: weaver registry check
        run: mise run github:workflows:ci:otel-check

      - name: generated code is up to date
        run: mise run github:workflows:ci:otel-generated

  workflows:
    name: Workflows
    needs: [runs-on, changes]
    if: ${{ !cancelled() && needs.changes.outputs.workflows != 'false' }}
    runs-on: ${{ needs.runs-on.outputs.runs-on }}
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      - name: zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run github:workflows:ci:workflows-zizmor

      - name: zizmor SARIF report
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run github:workflows:ci:workflows-zizmor-sarif

      - name: Upload zizmor SARIF
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: zizmor-results.sarif
          category: zizmor

  studio:
    name: Studio
    needs: [runs-on, changes]
    if: ${{ !cancelled() && needs.changes.outputs.studio != 'false' }}
    runs-on: ${{ needs.runs-on.outputs.runs-on }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      - name: pnpm install
        run: mise run github:workflows:ci:studio-install

      - name: typecheck
        run: mise run github:workflows:ci:studio-typecheck

      - name: lint
        run: mise run github:workflows:ci:studio-lint

      # build before test: the server suite asserts container-mode behaviour
      # that only exists once dist/ is present.
      - name: build
        run: mise run github:workflows:ci:studio-build

      - name: test coverage
        run: mise run github:workflows:ci:studio-coverage

      - name: upload coverage to codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: tsworkspace/webapps/studio/coverage/lcov.info
          flags: studio
          use_oidc: true
          fail_ci_if_error: false

  studio-e2e:
    name: E2E
    needs: [runs-on, changes]
    if: ${{ !cancelled() && needs.changes.outputs.studio != 'false' }}
    runs-on: ${{ needs.runs-on.outputs.runs-on }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      - name: pnpm install
        run: mise run github:workflows:ci:studio-install

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tsworkspace/pnpm-lock.yaml') }}

      - name: install Playwright browsers
        run: mise run github:workflows:ci:studio-e2e-install

      - name: e2e
        run: mise run github:workflows:ci:studio-e2e

      - name: upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: studio-playwright-report
          path: tsworkspace/webapps/studio/playwright-report/
          retention-days: 7
