name: OSV-Scanner

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scan:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      - name: osv-scanner
        id: scan
        continue-on-error: true
        run: mise run github:workflows:osv-scanner:scan

      - name: Upload SARIF
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif

      - name: Fail on vulnerabilities
        if: ${{ steps.scan.outcome == 'failure' }}
        run: exit 1
