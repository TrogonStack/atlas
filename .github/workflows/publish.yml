name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  runs-on:
    uses: ./.github/workflows/runs-on.yml

  images:
    name: Image (${{ matrix.image }})
    needs: runs-on
    runs-on: ${{ needs.runs-on.outputs.runs-on }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - trogon-atlas-server
          - trogon-atlas-studio

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          cache: false

      - name: Reclaim runner disk
        run: mise run github:workflows:ci:reclaim-disk

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/trogonstack/images/atlas/${{ matrix.image }}
          tags: |
            type=raw,value=canary
            type=sha,format=long,prefix=

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: devops/docker/images/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: |
            type=gha,scope=${{ matrix.image }}
            type=gha,scope=${{ matrix.image }}-canary
          cache-to: type=gha,scope=${{ matrix.image }}-canary,mode=max

  charts:
    name: Chart (${{ matrix.chart }})
    needs: [runs-on, images]
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ needs.runs-on.outputs.runs-on }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        chart:
          - trogon-atlas-server
          - trogon-atlas-studio

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      - name: helm registry login
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_PASSWORD" | mise exec -- helm registry login ghcr.io --username "$REGISTRY_USERNAME" --password-stdin

      - name: publish chart
        env:
          CHARTS_REGISTRY: oci://ghcr.io/trogonstack/charts/atlas
          CHART: ${{ matrix.chart }}
          COMMIT: ${{ github.sha }}
        run: mise run github:workflows:publish:chart "$CHART" "0.0.0-sha-$COMMIT" "$COMMIT"

  release-charts:
    name: Charts
    needs: runs-on
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-charts.yml
    with:
      runs-on: ${{ needs.runs-on.outputs.runs-on }}
      ref: ${{ github.sha }}
