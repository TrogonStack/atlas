version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/rsworkspace"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      grpc:
        patterns:
          - "tonic"
          - "tonic-*"
          - "prost"
          - "prost-*"
          - "protox"
          - "protox-*"
      opentelemetry:
        patterns:
          - "opentelemetry*"
          - "tracing-opentelemetry"
      rustcrypto:
        patterns:
          - "sha2"
          - "chacha20poly1305"
          - "digest"
          - "aead"
          - "hmac"
          - "hkdf"
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/tsworkspace"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-development:
        dependency-type: "development"
      npm-production:
        dependency-type: "production"

  - package-ecosystem: "docker"
    directories:
      - "/devops/docker/images/trogon-atlas-server"
      - "/devops/docker/images/trogon-atlas-studio"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-minor-patch:
        update-types:
          - "minor"
          - "patch"
