[graph]
targets = []

[advisories]
ignore = [
  # Fix needs lru 0.18, which tantivy 0.26 does not allow yet; blocked on a tantivy release that bumps lru.
  "RUSTSEC-2026-0253",
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]
private = { ignore = true }

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Workspace path dependencies carry no version requirement by design; only
# external wildcard requirements are a hygiene problem.
allow-wildcard-paths = true
# Benign duplicate crate versions pulled in by different versions of
# third-party dependencies. These are not security concerns; skip them
# until the direct deps align on a common version.
skip = [
  { name = "base64" },
  { name = "darling" },
  { name = "darling_core" },
  { name = "darling_macro" },
  { name = "getrandom" },
  { name = "hashbrown" },
  { name = "ordered-float" },
  { name = "rand" },
  { name = "rand_chacha" },
  { name = "rand_core" },
  { name = "reqwest" },
  { name = "rustix" },
  { name = "sketches-ddsketch" },
  { name = "syn" },
  { name = "webpki-roots" },
  # async-nats needs nkeys 0.4, whose latest release still signs with ed25519-dalek 2 and
  # signatory 0.27, keeping the pre-0.11 RustCrypto digest stack alive beside ours.
  { crate = "block-buffer@0.10", reason = "nkeys 0.4 via ed25519-dalek 2" },
  { crate = "const-oid@0.9", reason = "nkeys 0.4 via signatory 0.27" },
  { crate = "crypto-common@0.1", reason = "nkeys 0.4 via ed25519-dalek 2" },
  { crate = "digest@0.10", reason = "nkeys 0.4 via ed25519-dalek 2" },
  { crate = "sha2@0.10", reason = "nkeys 0.4 via ed25519-dalek 2" },
  # Tiny transitive duplicates from testcontainers/getrandom version spread.
  { name = "cpufeatures" },
  { name = "linux-raw-sys" },
  { name = "r-efi" },
  { name = "windows-sys" },
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
