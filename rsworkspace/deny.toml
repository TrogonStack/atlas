[graph]
targets = []

[advisories]
ignore = [
  { id = "RUSTSEC-2026-0381", reason = "0.26.11 only reexports patched 1.x roots; bans below reject every affected version except this data-free shim" },
  { id = "RUSTSEC-2026-0440", reason = "testsupport's testcontainers 0.27 depends on astral-tokio-tar, which is unmaintained with no patched release; nothing outside tests reaches it" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]
private = { ignore = true }

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Workspace path dependencies carry no version requirement by design; only
# external wildcard requirements are a hygiene problem.
allow-wildcard-paths = true
deny = [
  { name = "webpki-roots", version = "<0.26.11", reason = "certificate data must exclude distrusted emSign roots" },
  { name = "webpki-roots", version = ">0.26.11, <1.0.10", reason = "only the data-free 0.26.11 shim may precede patched certificate data" },
]
# Benign duplicate crate versions pulled in by different versions of
# third-party dependencies. These are not security concerns; skip them
# until the direct deps align on a common version.
skip = [
  { crate = "itertools@0.15", reason = "object_store 0.14 requires 0.15 while prost 0.14 still requires 0.14" },
  { name = "base64" },
  { name = "darling" },
  { name = "darling_core" },
  { name = "darling_macro" },
  { name = "getrandom" },
  { name = "hashbrown" },
  { name = "ordered-float" },
  { name = "rand" },
  { name = "rand_chacha" },
  { name = "rand_core" },
  { name = "reqwest" },
  { name = "rustix" },
  { name = "sketches-ddsketch" },
  { name = "syn" },
  { name = "webpki-roots" },
  # async-nats needs nkeys 0.4, whose latest release still signs with ed25519-dalek 2 and
  # signatory 0.27, keeping the pre-0.11 RustCrypto digest stack alive beside ours.
  { crate = "block-buffer@0.10", reason = "nkeys 0.4 via ed25519-dalek 2" },
  { crate = "const-oid@0.9", reason = "nkeys 0.4 via signatory 0.27" },
  { crate = "crypto-common@0.1", reason = "nkeys 0.4 via ed25519-dalek 2" },
  { crate = "digest@0.10", reason = "nkeys 0.4 via ed25519-dalek 2" },
  { crate = "sha2@0.10", reason = "nkeys 0.4 via ed25519-dalek 2" },
  # The direct ed25519-dalek 3 upgrade uses the RustCrypto 3.x stack while
  # async-nats 0.51 still reaches the 2.x stack through nkeys 0.4.
  { crate = "curve25519-dalek@4.1.3", reason = "nkeys 0.4 via ed25519-dalek 2" },
  { crate = "curve25519-dalek@5.0.0", reason = "direct ed25519-dalek 3 dependency" },
  { crate = "der@0.7.10", reason = "nkeys 0.4 via signatory 0.27" },
  { crate = "der@0.8.3", reason = "direct ed25519-dalek 3 dependency" },
  { crate = "ed25519@2.2.3", reason = "nkeys 0.4 via ed25519-dalek 2" },
  { crate = "ed25519@3.0.0", reason = "direct ed25519-dalek 3 dependency" },
  { crate = "ed25519-dalek@2.2.0", reason = "nkeys 0.4 via async-nats 0.51" },
  { crate = "ed25519-dalek@3.0.0", reason = "direct workspace dependency" },
  { crate = "fiat-crypto@0.2.9", reason = "nkeys 0.4 via ed25519-dalek 2" },
  { crate = "fiat-crypto@0.3.0", reason = "direct ed25519-dalek 3 dependency" },
  { crate = "pem-rfc7468@0.7.0", reason = "nkeys 0.4 via signatory 0.27" },
  { crate = "pem-rfc7468@1.0.0", reason = "direct ed25519-dalek 3 dependency" },
  { crate = "pkcs8@0.10.2", reason = "nkeys 0.4 via signatory 0.27" },
  { crate = "pkcs8@0.11.0", reason = "direct ed25519-dalek 3 dependency" },
  { crate = "signature@2.2.0", reason = "nkeys 0.4 via ed25519-dalek 2" },
  { crate = "signature@3.0.0", reason = "direct ed25519-dalek 3 dependency" },
  { crate = "spki@0.7.3", reason = "nkeys 0.4 via signatory 0.27" },
  { crate = "spki@0.8.1", reason = "direct ed25519-dalek 3 dependency" },
  # Tiny transitive duplicates from testcontainers/getrandom version spread.
  { name = "cpufeatures" },
  { name = "linux-raw-sys" },
  { name = "r-efi" },
  { name = "windows-sys" },
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
