[graph]
targets = []

[advisories]
ignore = [
  # rustls-pemfile is unmaintained with no known exploit; tonic 0.12 TLS pulls it in until tonic moves on.
  "RUSTSEC-2025-0134",
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]
private = { ignore = true }

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Workspace path dependencies carry no version requirement by design; only
# external wildcard requirements are a hygiene problem.
allow-wildcard-paths = true
# Benign duplicate crate versions pulled in by different versions of
# third-party dependencies. These are not security concerns; skip them
# until the direct deps align on a common version.
skip = [
  { name = "axum" },
  { name = "axum-core" },
  { name = "base64" },
  { name = "chacha20" },
  { name = "darling" },
  { name = "darling_core" },
  { name = "darling_macro" },
  { name = "getrandom" },
  { name = "hashbrown" },
  { name = "indexmap" },
  { name = "matchit" },
  { name = "ordered-float" },
  { name = "prost" },
  { name = "prost-derive" },
  { name = "prost-types" },
  { name = "rand" },
  { name = "rand_chacha" },
  { name = "rand_core" },
  { name = "reqwest" },
  { name = "rustix" },
  { name = "sketches-ddsketch" },
  { name = "socket2" },
  { name = "syn" },
  { name = "thiserror" },
  { name = "thiserror-impl" },
  { name = "tonic" },
  { name = "tonic-types" },
  { name = "tower" },
  { name = "webpki-roots" },
  # Tiny transitive duplicates from testcontainers/getrandom version spread.
  { name = "cpufeatures" },
  { name = "linux-raw-sys" },
  { name = "r-efi" },
  { name = "windows-sys" },
  { name = "windows-targets" },
  { name = "windows_aarch64_gnullvm" },
  { name = "windows_aarch64_msvc" },
  { name = "windows_i686_gnu" },
  { name = "windows_i686_gnullvm" },
  { name = "windows_i686_msvc" },
  { name = "windows_x86_64_gnu" },
  { name = "windows_x86_64_gnullvm" },
  { name = "windows_x86_64_msvc" },
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
