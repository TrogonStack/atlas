[package]
name = "trogon-atlas-types"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "Compiles tenant-owned protobuf source text in memory and keeps the registry's type rules: package ownership, limits, and wire/JSON compatibility."

[dependencies]
trogon-atlas-proto = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
prost-reflect = "0.16"
protox = "=0.10.0"
miette = "7"
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
