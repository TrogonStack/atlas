[package]
name = "trogon-atlas-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "Shared write-discipline semantics (manifest parsing, apply planning, export, legacy-annotation repair) for every surface that talks to the trogon-atlas gRPC service."

[dependencies]
trogon-atlas-proto = { workspace = true }
trogon-atlas-core = { workspace = true }
trogon-atlas-types = { workspace = true }
tonic = { workspace = true, features = ["tls-ring", "tls-native-roots"] }
tonic-types = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
prost-reflect = { version = "0.16", features = ["serde"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = "0.9"
similar = "2"
anyhow = { workspace = true }
thiserror = { workspace = true }
tower = { version = "0.5", features = ["util"] }
http = "1"
http-body = "1"
bytes = { workspace = true }

[dev-dependencies]
trogon-atlas-server = { workspace = true }
trogon-atlas-store = { workspace = true }
trogon-atlas-testsupport = { workspace = true }
tokio-stream = { workspace = true, features = ["net"] }
jsonschema = { workspace = true }
toml = "1.1"
tempfile = { workspace = true }

[lints]
workspace = true
