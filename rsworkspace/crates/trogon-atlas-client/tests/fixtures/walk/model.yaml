apiVersion: eventmodel.atlas.trogonstack.com/v1alpha1
kind: Swimlane
metadata:
  name: review
  namespace: walk-reviews
spec:
  state:
  - name: status
    type:
      string: {}
  streamId: review-{review_id}
  title: Review
  transitions:
  - after:
      id:
        namespace: walk-reviews
        slug: review.submitted
        version: '1'
    next:
    - event:
        id:
          namespace: walk-reviews
          slug: review.approved
          version: '1'
    - event:
        id:
          namespace: walk-reviews
          slug: review.rejected
          version: '1'
---
apiVersion: eventmodel.atlas.trogonstack.com/v1alpha1
kind: Event
metadata:
  name: review.submitted
  namespace: walk-reviews
spec:
  schema:
    '@type': type.googleapis.com/trogonatlas.eventmodel.v1alpha1.Schema
    fields:
    - name: review_id
      type:
        string: {}
    - name: rating
      type:
        int: {}
    - name: status
      type:
        string: {}
  swimlane:
    id:
      namespace: walk-reviews
      slug: review
      version: '1'
  title: review.submitted
---
apiVersion: eventmodel.atlas.trogonstack.com/v1alpha1
