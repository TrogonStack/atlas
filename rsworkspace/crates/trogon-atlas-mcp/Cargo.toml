[package]
name = "trogon-atlas-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "MCP tools over Streamable HTTP mapping each EventModelService RPC to an MCP tool."

[dependencies]
trogon-atlas-client = { workspace = true }
trogon-atlas-core = { workspace = true }
trogon-atlas-proto = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true, features = ["net"] }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = "1"
rmcp = { version = "3", features = ["server", "transport-streamable-http-server"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
http = "1"
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
prost-types = { workspace = true }
trogon-atlas-server = { workspace = true }
trogon-atlas-store = { workspace = true }
trogon-atlas-testsupport = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }
tokio-stream = { workspace = true, features = ["net"] }
tonic = { workspace = true }
tower = "0.5"
toml = "1.1"
rmcp = { version = "3", features = ["server", "client", "transport-streamable-http-client-reqwest"] }

[lints]
workspace = true
