[package]
name = "trogon-atlas-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "Schema-derived helpers over trogon-atlas-proto types: reference extraction, graph-walking primitives, and other utilities every server / tool depends on."

[dependencies]
trogon-atlas-proto = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
chrono = { workspace = true }
tracing = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
prost-reflect = { version = "0.14", features = ["serde"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = "1"
prost-types = { workspace = true }

[lints]
workspace = true
