[package]
name = "trogon-atlas-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "gRPC server for the Event Modeling service."

[features]
default = []

[[bin]]
name = "trogon-atlas-server"
path = "src/main.rs"

[dependencies]
trogon-atlas-proto = { workspace = true }
trogon-atlas-core = { workspace = true }
trogon-atlas-store = { workspace = true }
trogon-atlas-types = { workspace = true }
trogon-atlas-authzed = { workspace = true }
trogon-atlas-client = { workspace = true }
trogon-atlas-mcp = { workspace = true }
tonic = { workspace = true, features = ["tls-connect-info"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
tonic-health = { workspace = true }
tonic-types = { workspace = true }
axum = { version = "0.8", default-features = false }
subtle = "2"
sha2 = { workspace = true }
chacha20poly1305 = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-stream = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json"] }
clap = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
parking_lot = "0.12"
toml = "1.1"
tower = { version = "0.5", features = ["timeout", "util"] }
http = "1"
http-body = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tantivy = "0.26"
prost-reflect = { version = "0.16", features = ["text-format"] }
trogon-atlas-semconv = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic", "tls-ring", "tls-roots"] }
tracing-opentelemetry = "0.34"

[dev-dependencies]
rcgen = "0.14"
tonic = { workspace = true, features = ["tls-ring"] }
wiremock = "0.6"
trogon-atlas-testsupport = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
proptest = "1"
async-trait = { workspace = true }
tempfile = { workspace = true }
rmcp = { version = "3", features = ["client", "transport-streamable-http-client-reqwest"] }
opentelemetry_sdk = { version = "0.33", features = ["testing"] }

[lints]
workspace = true
