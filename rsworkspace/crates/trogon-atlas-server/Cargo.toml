[package]
name = "trogon-atlas-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "gRPC server for the Event Modeling service."

[features]
default = []

[[bin]]
name = "trogon-atlas-server"
path = "src/main.rs"

[dependencies]
trogon-atlas-proto = { workspace = true }
trogon-atlas-core = { workspace = true }
trogon-atlas-store = { workspace = true }
trogon-atlas-types = { workspace = true }
trogon-atlas-authzed = { workspace = true }
tonic = { workspace = true, features = ["tls"] }
tonic-health = { workspace = true }
tonic-types = { workspace = true }
subtle = "2"
sha2 = { workspace = true }
chacha20poly1305 = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-stream = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json"] }
clap = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
parking_lot = "0.12"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false, features = ["http-listener"] }
toml = "0.8"
tower = "0.5"
http = "1"
http-body = "1"
pin-project-lite = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tantivy = "0.26"
prost-reflect = { version = "0.14", features = ["text-format"] }
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.33"

[dev-dependencies]
wiremock = "0.6"
trogon-atlas-testsupport = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
proptest = "1"
async-trait = { workspace = true }

[lints]
workspace = true
