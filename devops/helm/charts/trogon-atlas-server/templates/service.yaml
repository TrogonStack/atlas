apiVersion: v1
kind: Service
metadata:
  name: {{ include "trogon-atlas-server.fullname" . }}
  labels:
    {{- include "trogon-atlas-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: private
      port: {{ .Values.service.port }}
      targetPort: private
      protocol: TCP
      {{- if not .Values.tls.existingSecret }}
      appProtocol: kubernetes.io/h2c
      {{- end }}
  selector:
    {{- include "trogon-atlas-server.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
