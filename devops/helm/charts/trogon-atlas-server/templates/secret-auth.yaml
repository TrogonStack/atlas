{{- $auth := .Values.auth }}
{{- $ownTokensFile := and $auth.tokensFile.content (not $auth.tokensFile.existingSecret) }}
{{- $ownToken := and $auth.token.value (not $auth.token.existingSecret) }}
{{- if or $ownTokensFile $ownToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "trogon-atlas-server.fullname" . }}-auth
  labels:
    {{- include "trogon-atlas-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
type: Opaque
stringData:
  {{- if $ownTokensFile }}
  {{ $auth.tokensFile.key }}: |
    {{- $auth.tokensFile.content | nindent 4 }}
  {{- end }}
  {{- if $ownToken }}
  {{ $auth.token.key }}: {{ $auth.token.value | quote }}
  {{- end }}
{{- end }}
