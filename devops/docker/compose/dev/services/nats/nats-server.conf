# NATS server config: JetStream + WebSocket for the studio.
#
# Two identities, because the two listeners have different threat models:
#
#   4222 (tcp)  -> `service`, full publish/subscribe, password required.
#                  Only trogon-atlas-server dials it.
#   8080 (ws)   -> `studio_browser`, read-only and scoped to one bucket,
#                  anonymous. Published on 127.0.0.1 for the browser.
#
# Why the split. The ownership registry is just rows in a KV bucket, so
# anything that can write that bucket can reassign a namespace to itself,
# and trogon-atlas-server syncs the forged row into SpiceDB on its next
# startup. Previously both listeners shared one `publish: ">"` identity,
# which put that escalation one WebSocket away from any browser tab.
#
# Why 4222 needs a password even though compose publishes no host port
# for it. OrbStack resolves every container by DNS regardless of what is
# published, so `nats.trogon-atlas.orb.local:4222` answers from the host.
# Measured against this stack while it ran anonymous: an unauthenticated
# CONNECT from the host was accepted and `$JS.API.STREAM.INFO` on the
# namespace bucket returned its contents. "Not published" was never a
# boundary here; the password is.
#
# Binding 8080 to 127.0.0.1 is NOT a boundary against the machine's own
# browser. WebSockets do not get the same-origin protection XHR does: the
# browser sends `Origin` but the server has to enforce it. With no origin
# check, any page a developer merely visited could open
# ws://127.0.0.1:8080 and inherit whatever the listener granted.
#
# Hence `allowed_origins` below. Note it must be `allowed_origins` and NOT
# `same_origin: true`: `same_origin` compares Origin against the request
# Host *including port*, and the studio is served from :8788 while NATS
# listens on :8080, so it rejects the studio along with the attacker.
# Measured against nats:2.10.14 with Origin `http://127.0.0.1:8788`:
#
#   same_origin: true                            -> 403 (studio broken)
#   allowed_origins: ["http://127.0.0.1:8788"]   -> 101 (evil.example.com 403)
#
# The origin check only constrains browsers; a client that simply omits
# the Origin header is still admitted, because non-browser clients do not
# send one. That is why it is paired with the `studio_browser` permission
# set rather than relied on alone. The origin list stops the drive-by; the
# permissions decide what an admitted client can actually do.
#
# If you serve the studio from an origin not listed below, the realtime
# channel goes offline until you add it. That is the intended failure
# mode: it fails closed and visibly, rather than open and silently.
#
# Before exposing this server beyond localhost, do one of:
#   1. Front 8080 with a TLS-terminating reverse proxy that enforces an
#      IP allowlist or an authenticated tunnel (Tailscale, Cloudflare
#      Access, etc.). Cheapest first step.
#   2. Switch to nkey/JWT auth: define an account, issue short-lived
#      JWTs from a gateway (`/api/nats-token` on the studio bridge),
#      replace `no_auth_user` with a JWT resolver. `nats.ws` supports
#      this natively via `jwtAuthenticator()`. The schema and KV
#      structure do not change; only the auth boundary does.
#
# JWT auth machinery is deliberately not built in-tree: the strategic
# backlog treats it as deferred until a real public-facing deployment
# exists.
# When that trigger fires, the changes touch only this file, the
# studio bridge, and `tsworkspace/webapps/studio/src/lib/realtime.ts`.

jetstream {
  store_dir: "/data"
}

# Monitoring, bound to the container's loopback rather than to every
# interface.
#
# The endpoints here need no credentials and there is no way to give them
# any: `/varz` reports the server's configuration, `/connz?auth=1` names
# every connected user, `/jsz` lists the streams and `/subsz` the subjects.
# None of it is a credential and none of it mutates anything, but together
# it describes the deployment to anybody who can reach the port.
#
# Publishing that port on `127.0.0.1` is not what confines it. OrbStack
# resolves every container by DNS, so `nats.trogon-atlas.orb.local:8222`
# answers from anywhere on this machine whatever compose publishes. Binding
# the listener itself is the only thing that does. The healthcheck reaches
# it from inside the container, so it is unaffected; from the host, go
# through `docker compose exec`.
http: "127.0.0.1:8222"

websocket {
  port: 8080
  no_tls: true

  # Every origin the studio is actually served from. localhost and
  # 127.0.0.1 are distinct origins to a browser, so both are needed. NATS
  # keeps one entry per hostname, so the orb.local studio is admitted over
  # https only; a plain http page there takes the bridge's change stream.
  allowed_origins: [
    "http://localhost:8788"
    "http://127.0.0.1:8788"
    "https://trogon-atlas-studio.trogon-atlas.orb.local"
  ]

  # This listener stays anonymous, and anonymous means `studio_browser`.
  # `no_auth_user` is set per listener, so the tcp listener below is
  # unaffected and still refuses a connection without credentials.
  no_auth_user: studio_browser
}

authorization {
  users: [
    # trogon-atlas-server. Owns every write in the system, so this password
    # is worth as much as the data: whoever holds it can rewrite the
    # ownership registry. The compose stack passes the same value to both
    # containers through $TROGON_ATLAS_NATS_PASSWORD and defaults it to a
    # well-known development string, which is fine only for one operator on
    # one machine: OrbStack answers on container DNS whether or not compose
    # publishes 4222, so the password is the whole of the control and
    # compose.auth.yaml refuses to start without a real one.
    # An unset variable refuses to start the server rather than admitting
    # an empty password, so a misconfigured deployment fails loudly.
    { user: service, password: $TROGON_ATLAS_NATS_PASSWORD, permissions: { publish: ">", subscribe: ">" } }

    # The browser. `tsworkspace/webapps/studio/src/lib/realtime.ts` does exactly one thing:
    # `js.views.kv('trogon-atlas-entities')` followed by `kv.watch()`. That
    # needs JetStream API calls (which are publishes) to look up the
    # stream and create an ephemeral consumer, plus an inbox to receive
    # on. It does not need to write anything, and it has no business
    # reading the ownership registry.
    #
    # Publishing to `$KV.>` is what a KV write is, so its absence here is
    # what makes registry forgery impossible from a browser. The
    # per-stream scoping on the JetStream subjects is what keeps
    # `trogon-atlas-namespaces` unreadable.
    #
    # What this does NOT do is scope the read. `$KV.trogon-atlas-entities.>`
    # is every namespace: keys are `<kind>.<namespace-id>.<name>.<version>`
    # and nothing here narrows the middle segment. There is one identity for
    # every browser, so there is nothing to narrow it to. Measured against
    # this stack: an anonymous WebSocket client read all 3353 entities across
    # all 131 namespaces, which is precisely what the gRPC lens exists to
    # prevent. Setting NATS_WS_AUTH_TOKEN stops a drive-by and changes none
    # of that, because it is one shared token.
    #
    # So a deployment that scopes namespaces per principal must not send its
    # browsers here at all. `/api/nats-auth` enforces that: a bridge holding
    # any credential, a fixed TROGON_ATLAS_AUTH_TOKEN as much as a pass-through
    # one, answers `transport: "sse"` and the studio uses
    # `/api/changes/stream`, which is authorized per caller because it goes
    # through the server. Per-principal JWTs would let this listener serve
    # them again; until then the channel is single-tenant.
    { user: studio_browser, permissions: {
        publish: { allow: [
          "$JS.API.INFO"
          "$JS.API.STREAM.INFO.KV_trogon-atlas-entities"
          "$JS.API.CONSUMER.CREATE.KV_trogon-atlas-entities"
          "$JS.API.CONSUMER.CREATE.KV_trogon-atlas-entities.>"
          "$JS.API.CONSUMER.INFO.KV_trogon-atlas-entities.>"
          "$JS.API.CONSUMER.DELETE.KV_trogon-atlas-entities.>"
          "$JS.API.CONSUMER.MSG.NEXT.KV_trogon-atlas-entities.>"
          # KV watch delivery stalls without flow-control replies.
          "$JS.FC.KV_trogon-atlas-entities.>"
        ]}
        subscribe: { allow: [
          "_INBOX.>"
          "$KV.trogon-atlas-entities.>"
        ]}
      }
    }
  ]
}
