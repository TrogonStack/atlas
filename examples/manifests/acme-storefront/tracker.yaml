apiVersion: eventmodel.atlas.trogonstack.com/v1alpha1
kind: Tracker
metadata:
  name: storefront-buildout
  namespace: acme-storefront
spec:
  doc: Delivery tracking for the storefront model. The tracker points at the model; the model never points back.
  items:
  - status: TRACK_STATUS_DONE
    subject:
      id:
        namespace: acme-storefront
        slug: add-item-to-cart-slice
        version: '1'
      kind: ENTITY_KIND_COMMAND_SLICE
  - status: TRACK_STATUS_DONE
    subject:
      id:
        namespace: acme-storefront
        slug: place-order-slice
        version: '1'
      kind: ENTITY_KIND_COMMAND_SLICE
  - status: TRACK_STATUS_IN_PROGRESS
    subject:
      id:
        namespace: acme-storefront
        slug: capture-payment-auto
        version: '1'
      kind: ENTITY_KIND_AUTOMATION_SLICE
  title: Storefront buildout
