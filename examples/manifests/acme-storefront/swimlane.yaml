apiVersion: eventmodel.atlas.trogonstack.com/v1alpha1
kind: Swimlane
metadata:
  name: cart
  namespace: acme-storefront
spec:
  doc: A shopper's in-progress cart.
  order: 1
  state:
  - name: item_count
    type:
      int: {}
  streamId: cart-{cart_id}
  title: Cart
---
apiVersion: eventmodel.atlas.trogonstack.com/v1alpha1
kind: Swimlane
metadata:
  name: order
  namespace: acme-storefront
spec:
  doc: A placed order through payment capture.
  order: 2
  state:
  - name: status
    type:
      enumeration:
        values:
        - placed
        - paid
  streamId: order-{order_id}
  title: Order
