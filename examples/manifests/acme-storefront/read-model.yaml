apiVersion: eventmodel.atlas.trogonstack.com/v1alpha1
kind: ReadModel
metadata:
  name: cart-summary
  namespace: acme-storefront
spec:
  doc: Running item count per cart.
  key:
  - cart_id
  schema:
    '@type': type.googleapis.com/trogonatlas.eventmodel.v1alpha1.Schema
    fields:
    - name: cart_id
      type:
        uuid: {}
    - name: item_count
      type:
        int: {}
    - name: product_id
      type:
        uuid: {}
    - name: quantity
      type:
        int: {}
  sourceEvents:
  - id:
      namespace: acme-storefront
      slug: cart.item-added
      version: '1'
  title: Cart summary
---
apiVersion: eventmodel.atlas.trogonstack.com/v1alpha1
kind: ReadModel
metadata:
  name: pending-payments
  namespace: acme-storefront
spec:
  doc: 'Worker feed: orders awaiting payment capture.'
  key:
  - order_id
  schema:
    '@type': type.googleapis.com/trogonatlas.eventmodel.v1alpha1.Schema
    fields:
    - name: order_id
      type:
        uuid: {}
    - name: buyer_id
      type:
        uuid: {}
    - name: seller_id
      type:
        uuid: {}
    - name: cart_id
      type:
        uuid: {}
    - name: placed_at
      type:
        timestamp: {}
    - name: paid_at
      type:
        timestamp: {}
    - name: status
      type:
        string: {}
  sourceEvents:
  - id:
      namespace: acme-storefront
      slug: order.placed
      version: '1'
  - id:
      namespace: acme-storefront
      slug: order.paid
      version: '1'
  title: Pending payments (queue)
