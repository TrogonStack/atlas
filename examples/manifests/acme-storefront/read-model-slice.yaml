apiVersion: eventmodel.atlas.trogonstack.com/v1alpha1
kind: ReadModelSlice
metadata:
  name: cart-summary-rms
  namespace: acme-storefront
spec:
  doc: An item added to the cart updates the running count.
  projectionRole: PROJECTION_ROLE_UPSERT
  readModel:
    readModel:
      id:
        namespace: acme-storefront
        slug: cart-summary
        version: '1'
  sourceEvents:
  - event:
      id:
        namespace: acme-storefront
        slug: cart.item-added
        version: '1'
  title: 'Projection: cart summary'
---
apiVersion: eventmodel.atlas.trogonstack.com/v1alpha1
kind: ReadModelSlice
metadata:
  name: pending-payments-rms
  namespace: acme-storefront
spec:
  doc: Pending row.
  projectionRole: PROJECTION_ROLE_UPSERT
  readModel:
    readModel:
      id:
        namespace: acme-storefront
        slug: pending-payments
        version: '1'
  sourceEvents:
  - event:
      id:
        namespace: acme-storefront
        slug: order.placed
        version: '1'
  title: 'Queue: pending payments'
---
apiVersion: eventmodel.atlas.trogonstack.com/v1alpha1
kind: ReadModelSlice
metadata:
  name: pending-payments-delete-rms
  namespace: acme-storefront
spec:
  doc: The order drops off the queue once its payment is captured.
  projectionRole: PROJECTION_ROLE_DELETE
  readModel:
    readModel:
      id:
        namespace: acme-storefront
        slug: pending-payments
        version: '1'
  sourceEvents:
  - event:
      id:
        namespace: acme-storefront
        slug: order.paid
        version: '1'
  title: 'Queue: payment captured'
