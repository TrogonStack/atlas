apiVersion: eventmodel.atlas.trogonstack.com/v1alpha1
kind: ReadModelSlice
metadata:
  name: cart-summary-rms
  namespace: acme-storefront
spec:
  doc: An item added to the cart updates the running count.
  projectionRole: PROJECTION_ROLE_UPSERT
  readModel:
    readModel:
      id:
        namespace: acme-storefront
        slug: cart-summary
        version: '1'
  sourceEvents:
  - event:
      id:
        namespace: acme-storefront
        slug: cart.item-added
        version: '1'
  title: 'Projection: cart summary'
