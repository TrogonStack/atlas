apiVersion: eventmodel.atlas.trogonstack.com/v1alpha1
kind: ReadModelSlice
metadata:
  name: order-status-rms
  namespace: acme-storefront
spec:
  doc: Each lifecycle event updates the shopper-facing status.
  projectionRole: PROJECTION_ROLE_UPSERT
  readModel:
    readModel:
      id:
        namespace: acme-storefront
        slug: order-status
        version: '1'
  sourceEvents:
  - event:
      id:
        namespace: acme-storefront
        slug: order.placed
        version: '1'
  - event:
      id:
        namespace: acme-storefront
        slug: order.paid
        version: '1'
