apiVersion: eventmodel.atlas.trogonstack.com/v1alpha1
kind: ReadModelSlice
metadata:
  name: progress-placed-rms
  namespace: acme-order-workflow
spec:
  doc: The order appears as waiting for tax.
  projectionRole: PROJECTION_ROLE_UPSERT
  readModel:
    readModel:
      id:
        namespace: acme-order-workflow
        slug: order-progress
        version: '1'
  sourceEvents:
  - event:
      id:
        namespace: acme-order-workflow
        slug: order.placed
        version: '1'
  title: 'Progress: order.placed'
