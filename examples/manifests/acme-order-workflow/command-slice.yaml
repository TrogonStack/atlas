apiVersion: eventmodel.atlas.trogonstack.com/v1alpha1
kind: CommandSlice
metadata:
  name: place-order-slice
  namespace: acme-order-workflow
spec:
  command:
    command:
      id:
        namespace: acme-order-workflow
        slug: place-order
        version: '1'
  doc: The shopper places the order.
  emittedEvents:
  - event:
      id:
        namespace: acme-order-workflow
        slug: order.placed
        version: '1'
  persona:
    persona:
      id:
        namespace: acme-order-workflow
        slug: shopper
        version: '1'
  scenarios:
  - doc: The shopper placed the order.
    emit:
      events:
      - event:
          id:
            namespace: acme-order-workflow
            slug: order.placed
            version: '1'
    id: order-placed
    title: Order placed
    when:
      command:
        id:
          namespace: acme-order-workflow
          slug: place-order
          version: '1'
  title: Place order
  ui:
    ui:
      id:
        namespace: acme-order-workflow
        slug: checkout-page
        version: '1'
---
apiVersion: eventmodel.atlas.trogonstack.com/v1alpha1
