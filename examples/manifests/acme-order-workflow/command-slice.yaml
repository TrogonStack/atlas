  title: Ship order
---
apiVersion: eventmodel.atlas.trogonstack.com/v1alpha1
kind: CommandSlice
metadata:
  name: cancel-order-slice
  namespace: acme-order-workflow
spec:
  command:
    command:
      id:
        namespace: acme-order-workflow
        slug: cancel-order
        version: '1'
  doc: 'Compensation: cancels an order whose payment failed.'
  emittedEvents:
  - event:
      id:
        namespace: acme-order-workflow
        slug: order.cancelled
        version: '1'
  scenarios:
  - doc: The order was cancelled after a failed step.
    emit:
      events:
      - event:
          id:
            namespace: acme-order-workflow
            slug: order.cancelled
            version: '1'
    id: order-cancelled
    title: Order cancelled
    when:
      command:
        id:
          namespace: acme-order-workflow
          slug: cancel-order
          version: '1'
  title: Cancel order
