---
apiVersion: eventmodel.atlas.trogonstack.com/v1alpha1
kind: CommandSlice
metadata:
  name: capture-payment-slice
  namespace: acme-order-workflow
spec:
  command:
    command:
      id:
        namespace: acme-order-workflow
        slug: capture-payment
        version: '1'
  doc: Captures the payment. The payment gateway decides whether it succeeds.
  emittedEvents:
  - event:
      id:
        namespace: acme-order-workflow
        slug: payment.captured
        version: '1'
  - event:
      id:
        namespace: acme-order-workflow
        slug: payment.failed
        version: '1'
  scenarios:
  - doc: The payment for the order was captured.
    emit:
      events:
      - event:
          id:
            namespace: acme-order-workflow
            slug: payment.captured
            version: '1'
    id: payment-captured
    title: Payment captured
    when:
      command:
        id:
          namespace: acme-order-workflow
          slug: capture-payment
          version: '1'
  - doc: The payment for the order was declined.
    emit:
      events:
      - event:
          id:
            namespace: acme-order-workflow
            slug: payment.failed
            version: '1'
    id: payment-failed
    title: Payment failed
    when:
      command:
        id:
          namespace: acme-order-workflow
          slug: capture-payment
          version: '1'
  title: Capture payment
---
