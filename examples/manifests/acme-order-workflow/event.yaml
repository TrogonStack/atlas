apiVersion: eventmodel.atlas.trogonstack.com/v1alpha1
kind: Event
metadata:
  name: order.placed
  namespace: acme-order-workflow
spec:
  doc: The shopper placed the order.
  schema:
    '@type': type.googleapis.com/trogonatlas.eventmodel.v1alpha1.Schema
    fields:
    - name: order_id
      type:
        uuid: {}
  swimlane:
    id:
      namespace: acme-order-workflow
      slug: order
      version: '1'
  title: Order placed
