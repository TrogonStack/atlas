apiVersion: eventmodel.atlas.trogonstack.com/v1alpha1
kind: EventModel
metadata:
  name: acme-order-workflow-model
  namespace: acme-order-workflow
spec:
  doc: One order runs through tax, payment and shipping, and is cancelled when payment fails.
  members:
  - id: acme/acme
    kind: ENTITY_KIND_DOMAIN
  - id: acme/ordering
    kind: ENTITY_KIND_SUBDOMAIN
  - id: acme-order-workflow
    kind: ENTITY_KIND_BOUNDED_CONTEXT
  - id: shopper
    kind: ENTITY_KIND_PERSONA
  - id: order
    kind: ENTITY_KIND_SWIMLANE
  - id: order.placed
    kind: ENTITY_KIND_EVENT
  - id: tax.calculated
    kind: ENTITY_KIND_EVENT
  - id: payment.captured
    kind: ENTITY_KIND_EVENT
  - id: payment.failed
    kind: ENTITY_KIND_EVENT
  - id: order.shipped
    kind: ENTITY_KIND_EVENT
  - id: order.cancelled
    kind: ENTITY_KIND_EVENT
  - id: place-order
    kind: ENTITY_KIND_COMMAND
  - id: calculate-tax
    kind: ENTITY_KIND_COMMAND
  - id: capture-payment
    kind: ENTITY_KIND_COMMAND
  - id: ship-order
    kind: ENTITY_KIND_COMMAND
  - id: cancel-order
    kind: ENTITY_KIND_COMMAND
  - id: order-progress
    kind: ENTITY_KIND_READ_MODEL
  - id: checkout-page
    kind: ENTITY_KIND_UI
  - id: tax-worker
    kind: ENTITY_KIND_PROCESSOR
  - id: payment-worker
    kind: ENTITY_KIND_PROCESSOR
  - id: shipping-worker
    kind: ENTITY_KIND_PROCESSOR
  - id: cancellation-worker
    kind: ENTITY_KIND_PROCESSOR
  - id: place-order-slice
    kind: ENTITY_KIND_COMMAND_SLICE
  - id: calculate-tax-slice
    kind: ENTITY_KIND_COMMAND_SLICE
  - id: capture-payment-slice
    kind: ENTITY_KIND_COMMAND_SLICE
  - id: ship-order-slice
    kind: ENTITY_KIND_COMMAND_SLICE
  - id: cancel-order-slice
    kind: ENTITY_KIND_COMMAND_SLICE
  - id: progress-placed-rms
    kind: ENTITY_KIND_READ_MODEL_SLICE
  - id: progress-taxed-rms
    kind: ENTITY_KIND_READ_MODEL_SLICE
  - id: progress-payment-rms
    kind: ENTITY_KIND_READ_MODEL_SLICE
  - id: progress-payment-failed-rms
    kind: ENTITY_KIND_READ_MODEL_SLICE
  - id: progress-shipped-rms
    kind: ENTITY_KIND_READ_MODEL_SLICE
  - id: progress-cancelled-rms
    kind: ENTITY_KIND_READ_MODEL_SLICE
  - id: tax-calculator
    kind: ENTITY_KIND_AUTOMATION_SLICE
  - id: payment-capturer
    kind: ENTITY_KIND_AUTOMATION_SLICE
  - id: shipper
    kind: ENTITY_KIND_AUTOMATION_SLICE
  - id: order-canceller
    kind: ENTITY_KIND_AUTOMATION_SLICE
  - id: order-workflow
    kind: ENTITY_KIND_STORYBOARD
  title: Acme Order Workflow
