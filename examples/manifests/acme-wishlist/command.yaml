apiVersion: eventmodel.atlas.trogonstack.com/v1alpha1
kind: Command
metadata:
  name: add-item-to-wishlist
  namespace: acme-wishlist
spec:
  doc: A shopper saves a product to their wishlist.
  schema:
    '@type': type.googleapis.com/trogonatlas.eventmodel.v1alpha1.Schema
    fields:
    - name: shopper_id
      type:
        uuid: {}
    - name: product_id
      type:
        uuid: {}
    - metadata:
      - '@type': type.googleapis.com/trogonatlas.eventmodel.v1alpha1.DerivedFieldAnnotation
        doc: now() when the item is added
        kind: KIND_TIMESTAMP
      name: added_at
      type:
        timestamp: {}
  swimlane:
    id:
      namespace: acme-wishlist
      slug: wishlist
      version: '1'
  title: Add item to wishlist
