apiVersion: eventmodel.atlas.trogonstack.com/v1alpha1
kind: Event
metadata:
  name: customer-data-deletion.requested
  namespace: acme-customer-data-deletion
spec:
  doc: An account owner requested deletion of their personal data.
  schema:
    '@type': type.googleapis.com/trogonatlas.eventmodel.v1alpha1.Schema
    fields:
    - metadata:
      - '@type': type.googleapis.com/trogonatlas.eventmodel.v1alpha1.PersonalDataAnnotation
        doc: Identifies the account holder the event is about (the event is immutable, so erasure relies on crypto shredding of the encryption key).
        erasure: ERASURE_CRYPTO_SHREDDING
      name: customer_id
      type:
        uuid: {}
    - metadata:
      - '@type': type.googleapis.com/trogonatlas.eventmodel.v1alpha1.DerivedFieldAnnotation
        doc: now() when the request is recorded
        kind: KIND_TIMESTAMP
      name: requested_at
      type:
        timestamp: {}
  swimlane:
    id:
      namespace: acme-customer-data-deletion
      slug: deletion
      version: '1'
  title: Customer data deletion requested
---
