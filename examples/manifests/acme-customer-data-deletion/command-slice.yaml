apiVersion: eventmodel.atlas.trogonstack.com/v1alpha1
kind: CommandSlice
metadata:
  name: complete-customer-data-deletion-slice
  namespace: acme-customer-data-deletion
spec:
  command:
    command:
      id:
        namespace: acme-customer-data-deletion
        slug: complete-customer-data-deletion
        version: '1'
  doc: Worker-issued once both vendors confirm deletion.
  emittedEvents:
  - event:
      id:
        namespace: acme-customer-data-deletion
        slug: customer-data-deletion.completed
        version: '1'
  scenarios:
  - doc: Both vendors confirmed.
    emit:
      events:
      - event:
          id:
            namespace: acme-customer-data-deletion
            slug: customer-data-deletion.completed
            version: '1'
    given:
    - event:
        id:
          namespace: acme-customer-data-deletion
          slug: analytics-deletion.started
          version: '1'
    - event:
        id:
          namespace: acme-customer-data-deletion
          slug: crm-deletion.started
          version: '1'
    id: confirmed
    title: Deletion completed
    when:
      command:
        id:
          namespace: acme-customer-data-deletion
          slug: complete-customer-data-deletion
          version: '1'
  title: Complete customer data deletion
