apiVersion: eventmodel.atlas.trogonstack.com/v1alpha1
kind: CommandSlice
metadata:
  name: request-customer-data-deletion-slice
  namespace: acme-customer-data-deletion
spec:
  command:
    command:
      id:
        namespace: acme-customer-data-deletion
        slug: request-customer-data-deletion
        version: '1'
  doc: The account owner requests deletion of their personal data.
  emittedEvents:
  - event:
      id:
        namespace: acme-customer-data-deletion
        slug: customer-data-deletion.requested
        version: '1'
  persona:
    persona:
      id:
        namespace: acme-customer-data-deletion
        slug: account-owner
        version: '1'
  scenarios:
  - doc: First request.
    emit:
      events:
      - event:
          id:
            namespace: acme-customer-data-deletion
            slug: customer-data-deletion.requested
            version: '1'
    id: requested
    title: Deletion requested
    when:
      command:
        id:
          namespace: acme-customer-data-deletion
          slug: request-customer-data-deletion
          version: '1'
  title: Request customer data deletion
  ui:
    ui:
      id:
        namespace: acme-customer-data-deletion
        slug: deletion-request-form
        version: '1'
---
