file_format: definition/2
attributes:
  - key: trogon_atlas.cache.name
    type:
      members:
        - id: snapshot
          value: snapshot
          stability: stable
          brief: The branch snapshot cache.
        - id: branch_search_index
          value: branch_search_index
          stability: stable
          brief: The per-branch search index cache.
    stability: stable
    brief: Which in-process cache a lookup went to.
  - key: trogon_atlas.cache.result
    type:
      members:
        - id: hit
          value: hit
          stability: stable
          brief: The lookup found a usable cached value.
        - id: miss
          value: miss
          stability: stable
          brief: The lookup rebuilt the value from its source of truth.
    stability: stable
    brief: Whether a cache lookup was satisfied from the cache.
metrics:
  - name: trogon_atlas.cache.lookups
    requirement_level: recommended
    instrument: counter
    unit: "{lookup}"
    stability: stable
    brief: In-process cache lookups, by cache and result.
    annotations:
      code_generation:
        metric_value_type: int
    attributes:
      - ref: trogon_atlas.cache.name
        requirement_level: required
      - ref: trogon_atlas.cache.result
        requirement_level: required
