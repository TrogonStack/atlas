file_format: definition/2
attributes:
  - key: trogon_atlas.llm.provider
    type: string
    stability: stable
    brief: The LLM provider that served the request.
    examples: ["anthropic"]
  - key: trogon_atlas.llm.model
    type: string
    stability: stable
    brief: The model name used for the request.
    examples: ["claude-sonnet-5"]
  - key: trogon_atlas.llm.token.type
    type:
      members:
        - id: input
          value: input
          stability: stable
          brief: Tokens sent to the model.
        - id: output
          value: output
          stability: stable
          brief: Tokens generated by the model.
    stability: stable
    brief: Which side of an LLM exchange a counted token belongs to.
metrics:
  - name: trogon_atlas.llm.request.duration
    requirement_level: recommended
    instrument: histogram
    unit: s
    stability: stable
    brief: Wall-clock duration of a complete LLM request, including retries.
    annotations:
      code_generation:
        metric_value_type: double
      aggregation:
        method: explicithistogram
        parameters:
          boundaries: [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10, 30, 60, 120]
    attributes:
      - ref: trogon_atlas.llm.provider
        requirement_level: required
      - ref: trogon_atlas.llm.model
        requirement_level: required
      - ref: error.type
        requirement_level:
          conditionally_required: The request did not complete successfully.
  - name: trogon_atlas.llm.tokens
    requirement_level: recommended
    instrument: counter
    unit: "{token}"
    stability: stable
    brief: Tokens exchanged with the LLM provider.
    annotations:
      code_generation:
        metric_value_type: int
    attributes:
      - ref: trogon_atlas.llm.model
        requirement_level: required
      - ref: trogon_atlas.llm.token.type
        requirement_level: required
  - name: trogon_atlas.llm.prompt_truncations
    requirement_level: recommended
    instrument: counter
    unit: "{truncation}"
    stability: stable
    brief: >
      Analysis prompts whose link list was truncated to fit the LLM's context
      budget.
    annotations:
      code_generation:
        metric_value_type: int
